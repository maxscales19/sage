<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="sage-api" content="https://script.google.com/macros/s/AKfycbzNiRmxy-RK1XtmR_7saWTU_vo-G7HfpAAJMSulZIqTQMWEe_3JVJQpTOVdowBqwKLv/exec">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sage">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF2EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131B16" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Sage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-screen phone app. Quiet sage surfaces, one deep green for actions,
   each of the five workouts owns a calm hue that follows it through planner, log and charts. */
:root{
  --bg:#EDF2EB; --surface:#FBFCFA; --surface2:#E2EAE0; --ink:#1D2A23; --muted:#62716A; --line:#D2DCD1;
  --accent-text:var(--accent); --accent:#46775C; --accent-ink:#FFFFFF; --accent-soft:#D6E5D9; --gold:#B98A1F; --danger:#B4533F;
  --w1:#5C8A6C; --w2:#3C7775; --w3:#768B45; --w4:#857FB0; --w5:#C9805F; --ws:#C2403A; --w-ink:#FFFFFF;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",sans-serif;
  --body:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(29,42,35,.06),0 6px 18px rgba(29,42,35,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131B16; --surface:#1B2620; --surface2:#24322A; --ink:#E5EEE7; --muted:#98A89D; --line:#2E3D33;
    --accent:#8CC09F; --accent-ink:#0F1F17; --accent-soft:#283B30; --gold:#E2B95A; --danger:#E08A76;
    --w1:#86B796; --w2:#6FB3B0; --w3:#A9BE74; --w4:#ACA6D6; --w5:#E3A486; --ws:#EC8177; --w-ink:#10201A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131B16; --surface:#1B2620; --surface2:#24322A; --ink:#E5EEE7; --muted:#98A89D; --line:#2E3D33;
  --accent:#8CC09F; --accent-ink:#0F1F17; --accent-soft:#283B30; --gold:#E2B95A; --danger:#E08A76;
  --w1:#86B796; --w2:#6FB3B0; --w3:#A9BE74; --w4:#ACA6D6; --w5:#E3A486; --ws:#EC8177; --w-ink:#10201A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column}
#top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 8px}
.brand{font:700 26px/1 var(--display);letter-spacing:-.02em}
.brand small{display:block;font:500 13px/1.3 var(--body);color:var(--muted);letter-spacing:0;margin-top:4px}
.icon-b{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.icon-b svg{width:20px;height:20px}
#main{flex:1;overflow-y:auto;padding:8px 16px 24px;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
#nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px 8px}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font:600 12px/1 var(--body);color:var(--muted);border-radius:12px}
#nav button svg{width:22px;height:22px}
#nav button[aria-current="page"]{color:var(--accent-text)}
h2{font:700 20px/1.2 var(--display);letter-spacing:-.01em;text-wrap:balance}
h3{font:600 13px/1.2 var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.btn.quiet{background:transparent;color:var(--muted);font-weight:600;padding:0 10px}
.btn.danger{background:transparent;color:var(--danger);font-weight:600}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}

/* Week planner */
.tray{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border-radius:14px;background:var(--c);color:var(--w-ink);font-weight:700;font-size:14px;text-align:left;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;line-height:1.15}
.chip:last-child:nth-child(odd){grid-column:1/-1}
.chip svg{width:16px;height:16px;flex:none;opacity:.85}
.prog{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.days{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;background:var(--surface);border-radius:var(--r);padding:8px 8px 8px 12px;min-height:64px;box-shadow:var(--shadow);border:2px solid transparent}
.day.today{border-color:var(--accent)}
.day.over{background:var(--accent-soft);border-color:var(--accent);border-style:dashed}
.day .dn{font:700 15px/1.1 var(--display)} .day .dd{font-size:12px;color:var(--muted)}
.day .slot{display:flex;flex-direction:column;gap:6px;min-width:0}
.day .empty{font-size:13px;color:var(--muted)}
.pill{display:flex;align-items:center;gap:8px;width:100%;border-radius:12px;background:var(--c);color:var(--w-ink);min-height:42px;padding:6px 10px;font-weight:700;font-size:14px;text-align:left;touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pill svg{width:14px;height:14px;flex:none;opacity:.8}
.pill .nm{flex:1;min-width:0}
.pill.done{opacity:.72}
.pill.lift{display:none}
.pill,.chip{transition:transform .15s,box-shadow .15s}
.pill.press,.chip.press{transform:scale(.96)}
.chip.held{opacity:.45}
#ins{height:42px;border-radius:12px;border:2px dashed var(--accent);background:var(--accent-soft)}
.pill .tick{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.3);display:grid;place-items:center;flex:none;font-size:12px}
.day .slot.gap-top{padding-top:0}
.set.cw{grid-template-columns:64px 1fr}
.set.cw .lab{text-align:left;color:var(--ink)}
.add{width:40px;height:40px;border-radius:50%;background:var(--surface2);font-size:22px;line-height:1;color:var(--muted)}
#ghost{position:fixed;z-index:60;pointer-events:none;padding:10px 14px;border-radius:14px;color:var(--w-ink);font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.25);transform:translate(-50%,-135%) rotate(-3deg);display:none;white-space:nowrap}

/* Library */
.wk{border-left:6px solid var(--c)}
.wk .list{font-size:14px;color:var(--muted);margin:6px 0 12px}
.banner{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600}
.banner .btn{background:var(--accent-ink);color:var(--accent)}

/* Session */
.sess-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{font-weight:600;color:var(--muted);min-height:44px;padding-right:8px}
.ex-h{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
.ex-n{font:700 17px/1.2 var(--display)}
.tag{display:inline-block;font:700 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:99px;background:var(--accent-soft);color:var(--ink);margin-bottom:6px}
.restb{flex:none;min-height:36px;padding:0 12px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:13px;white-space:nowrap}
.cols,.set{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center}
.set.one{grid-template-columns:30px 1fr 44px}
.cols{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:4px}
.cols.one{grid-template-columns:30px 1fr 44px}
.set{margin-bottom:8px}
.set .lab{font-weight:700;color:var(--muted);text-align:center;font-size:14px}
.fld{display:flex;align-items:center;background:var(--surface2);border-radius:12px;height:44px;overflow:hidden}
.fld button{width:30px;height:100%;font-size:20px;color:var(--muted);flex:none}
.fld input{flex:1;min-width:0;width:100%;background:none;border:0;text-align:center;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;outline:none}
.set.done .fld{background:var(--accent-soft)}
.chk{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:20px;font-weight:700}
.set.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.set.pb .chk{background:var(--gold);border-color:var(--gold)}
.round{border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.round:first-of-type{border-top:0;padding-top:0}
.exname{grid-column:2/-1;font-size:12px;font-weight:600;color:var(--muted);margin:-2px 0 2px}
.linkbtn{align-self:center;font-size:13px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:99px;border:1px dashed var(--line);margin:-4px 0}
.linkbtn.on{color:var(--accent-text);border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
#rest{display:none;background:var(--ink);color:var(--bg);padding:10px 16px 12px}
#rest.on{display:block}
#rest .t{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums;min-width:86px}
#rest .bar{height:4px;background:rgba(127,127,127,.35);border-radius:9px;overflow:hidden;margin-top:8px}
#rest .bar i{display:block;height:100%;background:var(--w1);width:100%}
#rest button{min-height:40px;padding:0 12px;border-radius:99px;background:rgba(127,127,127,.28);color:inherit;font-weight:700;font-size:14px}
#rest .nx{font-size:13px;opacity:.8;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Edit */
.stp{display:inline-flex;align-items:center;background:var(--surface2);border-radius:12px;height:40px}
.stp button{width:34px;height:100%;font-size:19px;color:var(--muted)}
.stp b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.ed-r{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:10px}
.ed-r label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:flex;flex-direction:column;gap:4px}
.mini{width:36px;height:36px;border-radius:10px;background:var(--surface2);color:var(--muted);font-size:16px}

/* Progress */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.tile b{display:block;font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);font-weight:600}
.grid7{display:grid;grid-template-columns:48px repeat(7,1fr);gap:6px;align-items:center;font-size:11px;color:var(--muted);text-align:center}
.grid7 .c{aspect-ratio:1;border-radius:8px;background:var(--surface2);max-height:30px}
.grid7 .c.t{outline:2px solid var(--accent);outline-offset:1px}
select{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-weight:600}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent-text);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.14}
.chart .pt{fill:var(--surface);stroke:var(--accent-text);stroke-width:2}
.chart .pbp{fill:var(--gold);stroke:var(--surface);stroke-width:2}
.chart text{fill:var(--muted);font:600 10px var(--body)}
.hist{display:flex;flex-direction:column}
.hist button,.hist div.h{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);text-align:left;width:100%;font-size:14px}
.hist :first-child{border-top:0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.pbm{color:var(--gold);font-weight:700}

/* Sheets, toast, PB */
#sheet{position:fixed;inset:0;z-index:40;display:none;align-items:flex-end;justify-content:center;background:rgba(15,25,20,.45)}
#sheet.on{display:flex}
#sheet .in{background:var(--surface);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px 22px;max-height:86%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opt{min-height:48px;border-radius:14px;background:var(--surface2);font-weight:700}
.opt.on{background:var(--accent);color:var(--accent-ink)}
.opt.w{background:var(--c);color:var(--w-ink);text-align:left;padding:8px 12px;font-size:14px}
.txt{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
#toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
#pb{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(15,25,20,.35);padding:24px}
#pb.on{display:grid}
#pb .in{background:var(--surface);border-radius:28px;padding:28px 26px;text-align:center;max-width:340px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
#pb .k{font:700 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
#pb .v{font:700 44px/1.05 var(--display);letter-spacing:-.02em;margin:10px 0 6px;font-variant-numeric:tabular-nums}
#pb .n{font:700 18px/1.2 var(--display)}

/* figures, library, workout screen */
.figb{width:46px;height:46px;border-radius:13px;background:var(--accent-soft);flex:none;display:grid;place-items:center}
.figb.lg{width:92px;height:92px;border-radius:22px}
.fig{width:40px;height:40px}.figb.lg .fig{width:80px;height:80px}
.fb{fill:none;stroke:var(--ink);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.fe{fill:none;stroke:var(--accent-text);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.xlist{display:flex;flex-direction:column}
.xrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.xlist>.xrow:first-child,.ssg>.xrow:first-of-type{border-top:0}
.xt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.xt b{font-weight:700;line-height:1.2}
.chev{color:var(--muted);font-size:22px;line-height:1;flex:none}
.ssg{border-left:3px solid var(--accent);padding:8px 0 2px 12px;margin:6px 0;border-top:1px solid var(--line)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:40px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.gch{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex:none}
.gch button{flex:none;min-height:36px;padding:0 12px;border-radius:99px;background:var(--surface2);font-weight:600;font-size:13px}
.gch button.on{background:var(--accent);color:var(--accent-ink)}
.wk-h{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left}
.optl{display:flex;gap:10px;font-size:14px;color:var(--muted);margin-top:8px;line-height:1.35}
.optl b{flex:none;color:var(--ink);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding-top:2px;width:64px}
.lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
#sheet .lbl{margin-bottom:-6px}
.tlink{color:var(--accent-text);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.cdot{width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid var(--surface)}
.cdot.on{box-shadow:0 0 0 2px var(--ink)}
.exhd{margin-bottom:10px;align-items:center}
.exhd .restb{display:inline-flex;align-items:center;gap:5px}
.ltr{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font:700 12px/1 var(--body);vertical-align:2px}
.rlab{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.actl{display:block;width:100%;text-align:left;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface2);border-radius:10px;padding:7px 10px;line-height:1.25}
.grid7 .c.a{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.tile.flat{background:var(--surface2);box-shadow:none}.tile.flat b{font-size:22px}
.lvchip{min-height:38px;padding:0 13px;border-radius:99px;background:var(--accent-soft);font-weight:700;font-size:13px;white-space:nowrap}
.hero{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:20px 18px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.hero .k{font:700 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;opacity:.82}
.hero .lv{font:700 38px/1 var(--display);letter-spacing:-.025em;margin:8px 0 14px}
.xpb{height:8px;border-radius:99px;background:color-mix(in srgb,currentColor 24%,transparent);overflow:hidden;margin-bottom:7px}
.xpb i{display:block;height:100%;background:currentColor;border-radius:99px}
.ringw{position:relative;width:96px;height:96px;flex:none;display:grid;place-items:center;text-align:center}
.ringw svg{position:absolute;inset:0;width:100%;height:100%}
.rt{fill:none;stroke:currentColor;opacity:.24;stroke-width:7}.rp{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round}
.ringw b{font:700 23px/1 var(--display);display:block}.ringw span{font-size:10px;font-weight:700;letter-spacing:.04em;opacity:.85}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 8px}
.bdg{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
.bdg.on{color:var(--ink);font-weight:700}
.medal{width:62px;height:62px}.bigm .medal{width:120px;height:120px}
.mt{fill:none;stroke:var(--surface2);stroke-width:4}.mp{fill:none;stroke:var(--accent-text);stroke-width:4;stroke-linecap:round}
.medal.on .mp{stroke:var(--gold)}.mf{fill:var(--accent)}

  const o={has:false,maxW:0,repsAt:{},maxR:0};
  sessions.forEach(s=>(s.entries||[]).forEach(e=>{if(e.ex!==exId)return;(e.sets||[]).forEach(st=>{
    if(st===skipSet||st.done===false)return;const w=num(st.w),r=num(st.r);if(!(r>0))return;
    o.has=true;if(w>o.maxW)o.maxW=w;if(r>(o.repsAt[w]||0))o.repsAt[w]=r;if(r>o.maxR)o.maxR=r})}));
  return o;
}
function lastSets(exId){
  for(let i=S.sessions.length-1;i>=0;i--){const e=(S.sessions[i].entries||[]).find(x=>x.ex===exId);if(e&&e.sets.length)return e.sets}
  return null;
}
function lastLine(exId,type,short){
  const ls=lastSets(exId);if(!ls)return short?'first time':'First time. Today sets your baseline.';
  const pre=short?'':'Last time: ';
  if(type==='w'){const same=ls.every(s=>num(s.w)===num(ls[0].w));return pre+(same?fmt(num(ls[0].w))+' kg × '+ls.map(s=>s.r).join(', '):ls.map(s=>fmt(num(s.w))+'×'+s.r).join(', '))}
  return pre+ls.map(s=>s.r+(type==='t'?'s':'')).join(', ');
}
const sessDone=(ds,w)=>S.sessions.some(s=>s.date===ds&&s.workoutId===w);
const pbCount=()=>S.sessions.reduce((n,s)=>n+(s.entries||[]).reduce((m,e)=>m+e.sets.filter(x=>x.pb).length,0),0);
const itemMeta=it=>{const x=X(it.ex)||{t:'w'};return it.sets+' sets × '+it.reps+(x.t==='t'?' seconds':' reps')+' · rest '+restLabel(it.rest)};

/* ---------- stats, levels, achievements ---------- */
const LEVELS=[['Seed',0],['Sprout',300],['Seedling',800],['Fern',1500],['Ivy',2500],['Willow',4000],['Olive',6000],['Cedar',9000],['Laurel',13000],['Evergreen',18000]];
const wkKey=ds=>iso(mondayOf(parseIso(ds)));
function calc(){
  const o={n:S.sessions.length,sets:0,vol:0,pbs:0,classes:0,maxVol:0,cmin:0,ckm:0,steps:0,maxSteps:0,maxWkMin:0,streak:0,best:0,perfect:0,variety:0,acts:(S.main.acts||[]).length};
  const weeks={},wkW={};
  S.sessions.forEach(s=>{let v=0;(s.entries||[]).forEach(e=>e.sets.forEach(x=>{if(x.pb)o.pbs++;if(e.type==='k')return;o.sets++;if(e.type==='w')v+=num(x.w)*num(x.r)}));
    o.vol+=v;if(v>o.maxVol)o.maxVol=v;if(s.cls)o.classes++;const k=wkKey(s.date);weeks[k]=1;(wkW[k]=wkW[k]||new Set()).add(s.workoutId)});
  const dayS={},wkM={};acts().forEach(a=>{o.cmin+=a.mins||0;o.ckm+=a.km||0;o.steps+=a.steps||0;dayS[a.date]=(dayS[a.date]||0)+(a.steps||0);const k=wkKey(a.date);wkM[k]=(wkM[k]||0)+(a.mins||0)});
  o.maxSteps=Math.max(0,...Object.values(dayS));o.maxWkMin=Math.max(0,...Object.values(wkM));o.variety=Math.max(0,...Object.values(wkW).map(s=>s.size));
  let m=mondayOf(new Date());if(!weeks[iso(m)])m=addDays(m,-7);while(weeks[iso(m)]){o.streak++;m=addDays(m,-7)}
  let run=0,prev=null;Object.keys(weeks).sort().forEach(k=>{run=prev&&iso(addDays(parseIso(prev),7))===k?run+1:1;if(run>o.best)o.best=run;prev=k});
  Object.keys(S.main.plans).forEach(k=>{const p=S.main.plans[k];let pl=0,dn=0;for(let i=0;i<7;i++)(p[i]||[]).forEach(e=>{pl++;if(sessDone(iso(addDays(parseIso(k),i)),e.w))dn++});if(pl>=3&&dn===pl)o.perfect++});
  return o;
}
function badges(c){return [
  ['first','First Step','Finish your first workout',c.n,1],
  ['w10','Ten Down','Finish 10 workouts',c.n,10],
  ['w25','Twenty-Five','Finish 25 workouts',c.n,25],
  ['w50','Half Century','Finish 50 workouts',c.n,50],
  ['w100','The Hundred','Finish 100 workouts',c.n,100],
  ['perfect','Perfect Week','Complete every workout you planned in a week (three or more)',c.perfect,1],
  ['st3','On a Roll','Train three weeks in a row',c.best,3],
  ['st8','Unbroken','Train eight weeks in a row',c.best,8],
  ['pb1','Personal Best','Set your first PB',c.pbs,1],
  ['pb10','PB Collector','Set 10 PBs',c.pbs,10],
  ['pb25','Record Breaker','Set 25 PBs',c.pbs,25],
  ['tonne','Tonne Club','Lift 1,000 kg in a single workout',Math.round(c.maxVol),1000],
  ['t10','Ten Tonnes','Lift 10,000 kg in total',Math.round(c.vol),10000],
  ['t50','Fifty Tonnes','Lift 50,000 kg in total',Math.round(c.vol),50000],
  ['pil10','Studio Regular','Complete 10 classes',c.classes,10],
  ['round','All-Rounder','Do four different workouts in one week',c.variety,4],
  ['cardio','Mover','Log 150 cardio minutes in a week',c.maxWkMin,150],
  ['steps','Ten Thousand','Log a 10,000-step day',c.maxSteps,10000]
].map(([id,name,desc,cur,goal])=>({id,name,desc,cur,goal,done:cur>=goal}))}
function levelOf(c,bs){const xp=c.n*100+c.sets*5+c.pbs*50+c.acts*25+bs.filter(b=>b.done).length*100;let i=0;while(i<LEVELS.length-1&&xp>=LEVELS[i+1][1])i++;const next=LEVELS[i+1];
  return {xp,i,name:LEVELS[i][0],next,pct:next?Math.round((xp-LEVELS[i][1])/(next[1]-LEVELS[i][1])*100):100}}
function snap(){const c=calc(),b=badges(c);return {done:new Set(b.filter(x=>x.done).map(x=>x.id)),lvl:levelOf(c,b)}}
function gained(before){const c=calc(),b=badges(c),l=levelOf(c,b);return {newB:b.filter(x=>x.done&&!before.done.has(x.id)),lvl:LV()&&l.i>before.lvl.i?l:null}}
/* what she has already been shown, so anything earned since (steps arriving while the app was shut, say) gets its moment on the way back in */
function markSeen(){const sn=snap(),b=[...sn.done].sort(),o=S.main.seen;if(o&&o.l===sn.lvl.i&&o.b.join()===b.join())return false;S.main.seen={b,l:sn.lvl.i};return true}
function welcomeBack(){
  if(!S.main.seen){if(markSeen())saveMain();return}
  if(S.main.active||ui.screen||$('#sheet').classList.contains('on')||$('#lock')||drag||(document.activeElement&&document.activeElement.matches('input')))return;
  const g=gained({done:new Set(S.main.seen.b),lvl:{i:S.main.seen.l}});
  if(!g.newB.length&&!g.lvl){if(markSeen())saveMain();return}
  markSeen();saveMain();render();
  sheet(`<div style="text-align:center"><span class="tag">Welcome back</span><h2 style="font-size:26px">${g.newB.length?(g.newB.length>1?g.newB.length+' new achievements':'New achievement'):'Level up'}</h2><p class="muted">Earned since you were last here.</p></div>
    ${g.newB.length?`<div class="wbm">${g.newB.map(b=>`<div>${medal(b)}<b>${esc(b.name)}</b><span>${esc(b.desc)}</span></div>`).join('')}</div>`:''}
    ${g.lvl?`<div class="unl"><small>Level up</small>Level ${g.lvl.i+1} · ${g.lvl.name}</div>`:''}
    <button class="btn wide" data-act="close">Lovely</button>`);
  confetti(1);
}
const unlockHTML=g=>g.newB.map(b=>`<div class="unl"><small>Achievement unlocked</small>${esc(b.name)}</div>`).join('')+(g.lvl?`<div class="unl"><small>Level up</small>Level ${g.lvl.i+1} · ${g.lvl.name}</div>`:'');
function medal(b){const C=2*Math.PI*27,p=Math.min(1,b.cur/b.goal);
  return `<svg viewBox="0 0 64 64" class="medal ${b.done?'on':''}" aria-hidden="true"><circle cx="32" cy="32" r="27" class="mt"/><circle cx="32" cy="32" r="27" class="mp" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/>${b.done?'<circle cx="32" cy="32" r="21" class="mf"/><path class="ml" d="M32 20c-6 5-9 10-9 14a9 9 0 0 0 18 0c0-4-3-9-9-14zM32 43V30"/>':`<text x="32" y="36.5" text-anchor="middle">${Math.floor(p*100)}%</text>`}</svg>`}

/* ---------- physio: exercises from a physio, ticked off each day ---------- */
const phItems=()=>S.main.physio.items,phLog=ds=>S.main.physio.log[ds]||{};
function phDay(ds){const it=phItems(),l=phLog(ds);let need=0,done=0;it.forEach(x=>{const p=Math.max(1,x.per||1);need+=p;done+=Math.min(p,l[x.id]||0)});return {need,done,full:need>0&&done>=need}}
function phStreak(){let n=0,d=new Date();if(!phDay(iso(d)).full)d=addDays(d,-1);while(phDay(iso(d)).full&&n<1000){n++;d=addDays(d,-1)}return n}
const phLine=x=>[(x.sets||1)+' × '+(x.hold?fmt(x.hold)+' sec hold':(x.reps||1)+(x.reps===1?' rep':' reps')),(x.per||1)>1?(x.per)+' times a day':'once a day'].join(' · ');
function vPhysio(){
  const today=iso(new Date()),ds=ui.phDay&&ui.phDay<=today?ui.phDay:today,it=phItems(),l=phLog(ds),st=phDay(ds),sk=phStreak();
  const strip=[...Array(7)].map((_,i)=>{const d=addDays(new Date(),i-6),k=iso(d),x=phDay(k);return `<button class="phd ${k===ds?'on':''} ${x.full?'full':x.done?'part':''}" data-act="ph-day" data-d="${k}" aria-label="${DAYS[(d.getDay()+6)%7]} ${d.getDate()}"><span>${DAYS[(d.getDay()+6)%7].slice(0,1)}</span><i>${x.full?'✓':d.getDate()}</i></button>`}).join('');
  const head=`<div class="hero ph"><div style="flex:1"><div class="small" style="opacity:.85">${ds===today?'Today':nice(ds)}</div><div class="ph-big num">${it.length?st.done+' of '+st.need:'Physio'}</div><div class="small" style="opacity:.85">${it.length?(st.full?'All done. Nice work.':'ticked off'):'Your exercises will live here.'}</div></div>${it.length?`<div class="ph-sk"><b class="num">${sk}</b><span>day streak</span></div>`:''}</div><div class="phw">${strip}</div>`;
  if(!it.length)return head+`<div class="card" style="text-align:center"><p class="muted">No physio exercises yet. Add each one your physio gave you, with how many and how often, then tick them off here every day.</p></div><button class="btn wide" data-act="ph-new">+ Add a physio exercise</button>`;
  return head+it.map(x=>{const p=Math.max(1,x.per||1),c=Math.min(p,l[x.id]||0);
    return `<div class="card phc ${c>=p?'done':''}"><div class="row between" style="align-items:flex-start"><div style="min-width:0"><div class="ex-n">${esc(x.n)}</div><div class="small muted">${esc(phLine(x))}</div>${x.note?`<div class="small" style="margin-top:6px">${esc(x.note)}</div>`:''}</div><button class="tlink" data-act="ph-edit" data-id="${x.id}">Edit</button></div>
      <div class="pht">${[...Array(p)].map((_,i)=>`<button class="${i<c?'on':''}" data-act="ph-tick" data-id="${x.id}" data-i="${i}" aria-label="${i<c?'Done':'Mark done'}${p>1?', round '+(i+1):''}" aria-pressed="${i<c}">${i<c?'✓':p>1?i+1:'Done'}</button>`).join('')}</div></div>`}).join('')+
    `<button class="btn ghost wide" data-act="ph-new">+ Add a physio exercise</button>`;
}

function vWeek(){
  const mon=addDays(mondayOf(new Date()),ui.weekOff*7),key=iso(mon),plan=S.main.plans[key]||{},today=iso(new Date());
  let planned=0,done=0;
  const rows=DAYS.map((dn,i)=>{
    const d=addDays(mon,i),ds=iso(d),es=(plan[i]||[]).filter(e=>W(e.w));
    const pills=es.map(e=>{const w=W(e.w),dn2=sessDone(ds,e.w),nm=vName(e.w,e.v)+(e.items?' (edited)':'');planned++;if(dn2)done++;
      return `<button class="pill ${dn2?'done':''}" style="--c:var(--w${w.c})" data-drag="entry" data-act="entry" data-day="${i}" data-id="${e.id}" data-label="${esc(nm)}" data-c="${w.c}">${ICON.drag}<span class="nm">${esc(nm)}</span>${dn2?'<span class="tick">✓</span>':''}</button>`}).join('');
    return `<div class="day ${ds===today?'today':''}" data-drop="${i}"><div><div class="dn">${dn}</div><div class="dd num">${d.getDate()} ${MON[d.getMonth()]}</div></div>
      <div class="slot">${pills}${actsOn(ds).map(a=>a.type==='Steps'&&GW()?`<button class="actl st cool" data-act="act-edit" data-id="${a.id}"><span>${ICON.watch}${esc(actLine(a))}</span><i style="width:${Math.min(100,Math.round(a.steps/stepGoal()*100))}%"></i></button>`:`<button class="actl ${a.type==='Steps'?'st':''}" data-act="act-edit" data-id="${a.id}">${esc(actLine(a))}</button>`).join('')}${pills||actsOn(ds).length?'':'<span class="empty">Rest day</span>'}</div><button class="add" data-act="day-add" data-day="${i}" aria-label="Add a workout to ${dn}">+</button></div>`}).join('');
  const tray=S.main.order.filter(W).map(id=>{const w=W(id);return `<button class="chip" style="--c:var(--w${w.c})" data-drag="w" data-w="${id}" data-label="${esc(w.name)}" data-c="${w.c}" data-act="tray">${ICON.drag}<span>${esc(w.name)}</span></button>`}).join('');
  const label=ui.weekOff===0?'This week':ui.weekOff===1?'Next week':ui.weekOff===-1?'Last week':'Week of '+nice(key);

function shortList(items){return groupsOf(items).map(g=>g.map(i=>(X(items[i].ex)||{n:'?'}).n).join(' + ')).join(' · ')}

function fld(ei,si,f,val,step,ph){return `<div class="fld"><button data-act="step" data-e="${ei}" data-s="${si}" data-f="${f}" data-d="${-step}" aria-label="Less">−</button><input id="f-${ei}-${si}-${f}" inputmode="decimal" autocomplete="off" data-e="${ei}" data-s="${si}" data-f="${f}" value="${esc(val)}" placeholder="${ph}" aria-label="${ph}"><button data-act="step" data-e="${ei}" data-s="${si}" data-f="${f}" data-d="${step}" aria-label="More">+</button></div>`}
function setRow(ei,si,label){
  const e=S.main.active.entries[ei],s=e.sets[si];
  const flds=e.type==='w'?fld(ei,si,'w',s.w,2.5,'kg')+fld(ei,si,'r',s.r,1,'reps'):fld(ei,si,'r',s.r,e.type==='t'?5:1,e.type==='t'?'secs':'reps');
  return `<div class="set ${e.type==='w'?'':'one'} ${s.done?'done':''} ${s.pb?'pb':''}"><span class="lab">${label}</span>${flds}<button class="chk" data-act="check" data-e="${ei}" data-s="${si}" aria-label="${s.done?'Undo set':'Log set'}" aria-pressed="${!!s.done}">${s.pb?'★':'✓'}</button></div>`;

function exHead(ei,letter){const e=S.main.active.entries[ei],x=X(e.ex)||{p:'generic'};

function vSession(){

}

function chart(pts,unit){
  const Wd=320,H=150,l=34,r=12,t=12,b=22;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  if(lo===hi){lo=Math.max(0,lo-5);hi=hi+5}else{const pad=(hi-lo)*.15;lo=Math.max(0,lo-pad);hi+=pad}
  const x=i=>pts.length===1?(l+Wd-r)/2:l+(Wd-l-r)*i/(pts.length-1),y=v=>t+(H-t-b)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<line class="g" x1="${l}" x2="${Wd-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-6}" y="${y(v)+3}" text-anchor="end">${fmt(Math.round(v*2)/2)}</text>`).join('');
  const d=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=pts.length>1?`<path class="ar" d="${d} L${x(pts.length-1)} ${H-b} L${x(0)} ${H-b} Z"/><path class="ln" d="${d}"/>`:'';
  const dots=pts.map((p,i)=>`<circle class="${p.pb?'pbp':'pt'}" cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5.5:p.pb?5:3.5}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="Progress chart in ${unit}">${ticks}${area}${dots}
    <text x="${l}" y="${H-5}">${pts[0].d}</text>${pts.length>1?`<text x="${Wd-r}" y="${H-5}" text-anchor="end">${pts[pts.length-1].d}</text>`:''}</svg>`;
}

function mealPool(p){

function mealPlan(key){
  const M=mealData(),p=M.prefs,old=weekOf(iso(addDays(new Date(key+'T00:00:00'),-7))),prev=[],wk={},used=[];
  Object.values(old).forEach(sl=>sl.items.forEach(x=>prev.push(x.id)));
  let last=null;

    const items=[],tot=totalPortions(p,sl.covers);
    for(let k=0;k<sl.kinds;k++){
      let r=null;for(let i=0;i<6&&!r;i++){const c=mealPick(p,used.concat(i<3?prev:[]));if(c&&(c.m!==last||i>3))r=c}
      r=r||mealPick(p,used)||(k?null:mealPick(p,[]));if(!r)break;items.push({id:r.id,n:0});used.push(r.id);last=r.m}
    if(!items.length)return;
    items.forEach((x,i)=>{x.n=Math.max(1,Math.floor(tot/items.length)+(i<tot%items.length?1:0))});
    wk[sl.d]={covers:sl.covers,items}});
  M.weeks[key]=wk;M.have[key]={};
  Object.keys(M.weeks).sort().slice(0,-8).forEach(k=>{delete M.weeks[k];delete M.have[k]});

}

const COACHLS='sage-coach-v1',COACHON=()=>!!API&&!!S.main.settings.coach,COACH=()=>COACHON()&&!!coachCfg;  /* nothing shows until the coach computer exists */
let coachCfg=null,coachUp=null;try{coachCfg=JSON.parse(localStorage.getItem(COACHLS)||'null')}catch(e){}
async function coachInit(){
  if(!COACHON()||!apiKey)return false;
  try{const j=await api({op:'coach'}),was=coachCfg&&coachCfg.url,had=!!coachCfg;coachCfg=j.off||!j.url?null:{url:j.url,token:j.token};
    try{if(coachCfg)localStorage.setItem(COACHLS,JSON.stringify(coachCfg));else localStorage.removeItem(COACHLS)}catch(e){}
    const el=$('#cst');if(el)el.textContent=coachLine();
    if(had!==!!coachCfg&&!ui.screen&&!$('#sheet.on')&&!ui.coachBusy)render();
    return !!coachCfg&&coachCfg.url!==was}catch(e){return false}
}
const coachLine=()=>!COACHON()?'A personal trainer that reads your numbers and answers questions.':!coachCfg?'Switched on, but the coach computer has not been set up yet.':coachUp===false?'The coach computer cannot be reached right now.':'Ready. Tap the speech bubble at the top to talk to it.';
function coachOnce(p,onDelta){
  return new Promise((res,rej)=>{
    if(!coachCfg)return rej(Object.assign(new Error('The coach has not been set up yet.'),{code:'off'}));
    const body=JSON.stringify(Object.assign({u:apiUser||'alex',t:coachCfg.token},p)),url=coachCfg.url;let settled=false,open=false,ws=null;
    const fail=(m,c)=>{if(!settled){settled=true;rej(Object.assign(new Error(m),{code:c||'down'}))}},ok=t=>{if(!settled){settled=true;coachUp=true;res(t)}};
    const post=()=>fetch(url+'/api',{method:'POST',body}).then(r=>r.json()).then(j=>{if(j&&j.ok){if(onDelta)onDelta(j.text);ok(j.text)}else fail((j&&j.msg)||'The coach could not answer that.',(j&&j.err)||'error')}).catch(()=>fail('Your coach is offline. The computer it runs on may be asleep or disconnected.'));
    try{ws=new WebSocket(url.replace(/^http/,'ws')+'/ws')}catch(e){post();return}
    const t=setTimeout(()=>{if(!open){const w=ws;ws=null;try{w.close()}catch(e){}post()}},7000);
    ws.onopen=()=>{open=true;clearTimeout(t);ws.send(body)};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}if(m.k==='d'){if(onDelta)onDelta(m.t)}else if(m.k==='end')ok(m.text);else if(m.k==='err')fail(m.msg,m.code||'error')};
    ws.onerror=()=>{if(!open&&ws){clearTimeout(t);ws=null;post()}};
    ws.onclose=()=>{if(open)fail('The coach was cut off part way through. Try again.')};
  });
}

/* ---------- session logic ---------- */
function startWorkout(wid,v,force){

  const w=W(wid);if(!w)return;if(!(v>=0&&v<w.vars.length))v=nextVar(wid);
  const pen=ui.screen&&ui.screen.from?planEntry(ui.screen.from):null;
  const entries=((pen&&pen.w===wid&&pen.items)||w.vars[v].items).filter(it=>X(it.ex)).map(it=>{const ex=X(it.ex),ls=lastSets(it.ex);
    const sets=[];for(let i=0;i<it.sets;i++){const p=ls?(ls[i]||ls[ls.length-1]):null;sets.push({w:ex.t==='w'?(p?fmt(num(p.w)):''):'',r:p?String(p.r):String(it.reps),done:false})}
    return {ex:it.ex,name:ex.n,type:ex.t,rest:it.rest,link:it.link,sets}});

  let on=iso(new Date());const fr=ui.screen&&ui.screen.from;
  if(fr&&fr.key&&fr.day>=0){const d=iso(addDays(new Date(fr.key+'T00:00:00'),+fr.day));if(d<on){on=d;setTimeout(()=>toast('Logging this for '+DAYS[+fr.day]),300)}}
  S.main.active={id:uid('s'),workoutId:wid,v,name:vName(wid,v),c:w.c,date:on,startedAt:Date.now(),entries,
    cls:w.cls?{name:w.cls.name,mins:w.cls.mins,done:false,wts:w.cls.wts?Object.fromEntries(CW.map(k=>{const ls=lastSets(cwId(wid,k));return [k,ls?fmt(num(ls[0].w)):'']})):null}:null};
  stopRest();closeSheet();ui.screen='session';saveMain();render();$('#main').scrollTop=0;
}
function checkPB(e,set){
  const prior=stats(e.ex,S.sessions);if(!prior.has)return null;
  const cur=stats(e.ex,[S.main.active],set);const w=num(set.w),r=num(set.r);if(!(r>0))return null;
  if(e.type==='w'){const maxW=Math.max(prior.maxW,cur.maxW);
    if(w>maxW)return {k:'Heaviest yet',v:fmt(w)+' kg',sub:'× '+r+' reps. Up from '+fmt(maxW)+' kg.'};
    if(w===maxW){const ra=Math.max(prior.repsAt[w]||0,cur.repsAt[w]||0);if(r>ra)return {k:'Most reps yet',v:r+' reps',sub:'at '+fmt(w)+' kg. Up from '+ra+'.'}}
    return null}
  const mr=Math.max(prior.maxR,cur.maxR);if(r>mr)return e.type==='t'?{k:'Longest hold',v:r+'s',sub:'Up from '+mr+'s.'}:{k:'Most reps yet',v:r+' reps',sub:'Up from '+mr+'.'};
  return null;
}
function nextUp(){const A=S.main.active;if(!A)return '';const gs=groupsOf(A.entries);
  for(const g of gs){const rounds=Math.max(...g.map(i=>A.entries[i].sets.length));for(let si=0;si<rounds;si++)for(const i of g){const s=A.entries[i].sets[si];if(s&&!s.done)return A.entries[i].name+', set '+(si+1)}}
  return A.cls&&!A.cls.done?A.cls.name:'';
}
function onCheck(ei,si){
  const A=S.main.active,e=A.entries[ei],s=e.sets[si];
  if(s.done){s.done=false;delete s.pb;saveMain();render();return}
  if(!(num(s.r)>0)){toast(e.type==='t'?'Add the seconds first':'Add your reps first');return}
  ensureAudio();
  const pb=checkPB(e,s);s.done=true;if(pb)s.pb=1;
  for(let j=si+1;j<e.sets.length;j++)if(!e.sets[j].done&&e.type==='w'&&(e.sets[j].w===''||num(e.sets[j].w)<num(s.w)))e.sets[j].w=s.w;
  saveMain();
  const g=groupsOf(A.entries).find(x=>x.includes(ei));
  const allDone=A.entries.every(x=>x.sets.every(y=>y.done));
  if(allDone)stopRest();
  else if(g.length>1){
    const pending=g.find(i=>A.entries[i].sets[si]&&!A.entries[i].sets[si].done);
    if(pending!==undefined){stopRest();if(!pb)toast('Straight into '+A.entries[pending].name+'. No rest yet.')}

  }else startRest(e.rest);

function classDone(){
  const A=S.main.active,c=A.cls;c.done=true;c.pb={};let first=null;
  if(c.wts)CW.forEach(k=>{const w=num(c.wts[k]);if(!(w>0))return;const pr=stats(cwId(A.workoutId,k),S.sessions);
    if(pr.has&&w>pr.maxW){c.pb[k]=1;if(!first)first={pb:{k:'Heaviest yet',v:fmt(w)+' kg',sub:'Up from '+fmt(pr.maxW)+' kg.'},name:c.name.replace(' class','')+', '+k+' weight'}}});
  saveMain();return first;
}
function finish(){
  const A=S.main.active;if(!A)return;let cpb=null;

  const entries=A.entries.map(e=>({ex:e.ex,name:e.name,type:e.type,sets:e.sets.filter(s=>s.done).map(s=>{const o={w:num(s.w),r:num(s.r)};if(s.pb)o.pb=1;return o})})).filter(e=>e.sets.length);
  const clsDone=A.cls&&A.cls.done;
  if(!entries.length&&!clsDone){sheet(`<h2>Nothing logged yet</h2><p class="muted">Tick off at least one set or the class to save this workout.</p><button class="btn wide" data-act="close">Keep going</button><button class="btn danger wide" data-act="discard-yes">Discard workout</button>`);return}
  const sess={id:A.id,workoutId:A.workoutId,v:A.v||0,name:A.name,c:A.c,date:A.date,startedAt:A.startedAt,finishedAt:Date.now(),entries};

  markSeen();saveMain();
  ui.screen=null;ui.tab='week';ui.weekOff=0;render();
  sheet(`<div style="text-align:center"><span class="tag">${sets?'Done':'Class done'}</span><h2 style="font-size:26px">${esc(sess.name)}</h2></div>
    ${sets?`<div class="tiles"><div class="tile"><b>${mins}</b><span>minutes</span></div><div class="tile"><b>${sets}</b><span>sets</span></div><div class="tile"><b style="color:var(--gold)">${pbs}</b><span>new PBs</span></div></div>`:''}
    ${entries.some(e=>e.type==='k')?`<p class="num" style="text-align:center;font-weight:700">${entries.filter(e=>e.type==='k').map(e=>CWL[e.ex.split('-').pop()]+' '+fmt(e.sets[0].w)+' kg').join(' · ')}</p>`:''}
    ${vol?`<p class="muted" style="text-align:center">You moved <b class="num" style="color:var(--ink)">${Math.round(vol).toLocaleString()} kg</b> in total${sess.cls?', plus your class':''}.</p>`:`<p class="muted" style="text-align:center">Ticked off${pbs?' with '+pbs+' new PB'+(pbs>1?'s':''):''}. Nice work.</p>`}
    ${pbList?`<div class="pbl"><small>Personal bests</small>${pbList}</div>`:''}
    ${COACH()&&coachCfg?'<div class="pbl" id="csum"><small style="color:var(--accent-text)">From your coach</small><div class="cmd"><span class="dots"><i></i><i></i><i></i></span></div></div>':''}
    ${unlockHTML(gain)}
    ${LV()?`<p class="small muted num" style="text-align:center">+${(100+sets*5+pbs*50+gain.newB.length*100).toLocaleString()} points</p>`:''}
    <button class="btn wide" data-act="close">Lovely</button>`);
  if(COACH()&&coachCfg){const sid=sess.id;chain.then(()=>coachSummary(sid),()=>coachSummary(sid))}
  const bigWin=gain.newB.length||gain.lvl;
  if(cpb)celebrate(cpb.pb,cpb.name);else confetti(pbs||bigWin?1:.45);
}

/* ---------- rest timer ---------- */
let rest=null,actx=null,beeps=[];
function ensureAudio(){if(!S.main.settings.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function cancelBeep(){beeps.forEach(o=>{try{o.stop()}catch(e){}});beeps=[]}
function scheduleBeep(sec){cancelBeep();if(!actx||!S.main.settings.sound)return;try{[0,.2,.4].forEach((o,i)=>{const osc=actx.createOscillator(),g=actx.createGain();osc.type='sine';osc.frequency.value=i===2?1046:784;const t=actx.currentTime+sec+o;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.17);osc.connect(g);g.connect(actx.destination);osc.start(t);osc.stop(t+.2);beeps.push(osc)})}catch(e){}}
function startRest(sec){if(!sec){stopRest();return}rest={end:Date.now()+sec*1000,total:sec,rung:false};scheduleBeep(sec);renderRest()}
function stopRest(){rest=null;cancelBeep();renderRest()}
function renderRest(){
  const el=$('#rest'),show=rest&&ui.screen==='session'&&S.main.active;
  el.classList.toggle('on',!!show);if(!show){el.innerHTML='';return}
  const left=Math.max(0,(rest.end-Date.now())/1000),nx=nextUp();
  el.innerHTML=`<div class="row"><span class="t" id="rt">${left>0?mmss(Math.ceil(left)):'Go'}</span><span class="nx">${left>0?'Rest':'Rest over'}${nx?'. Next: '+esc(nx):''}</span>
    <button data-act="rest-adj" data-d="-15" aria-label="15 seconds less">−15</button><button data-act="rest-adj" data-d="15" aria-label="15 seconds more">+15</button><button data-act="rest-skip">${left>0?'Skip':'OK'}</button></div>
    <div class="bar"><i id="rb" style="width:${rest.total?Math.min(100,left/rest.total*100):0}%"></i></div>`;
}
setInterval(()=>{
  const A=S.main.active,el=$('#elapsed');if(A&&el)el.textContent=mmss((Date.now()-A.startedAt)/1000);
  if(!rest)return;const left=(rest.end-Date.now())/1000,rt=$('#rt'),rb=$('#rb');
  if(left<=0&&!rest.rung){rest.rung=true;try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}renderRest();return}
  if(left<-20){stopRest();return}
  if(rt&&left>0)rt.textContent=mmss(Math.ceil(left));if(rb)rb.style.width=Math.max(0,Math.min(100,left/rest.total*100))+'%';

/* ---------- celebrations ---------- */
let pbT;
function celebrate(pb,name){
  $('#pb').innerHTML=`<div class="in"><div class="k">★ New personal best ★</div><div class="v">${esc(pb.v)}</div><div class="n">${esc(name)}</div><p class="muted" style="margin-top:6px">${esc(pb.k)}. ${esc(pb.sub)}</p></div>`;
  $('#pb').classList.add('on');clearTimeout(pbT);pbT=setTimeout(()=>$('#pb').classList.remove('on'),3400);
  try{navigator.vibrate&&navigator.vibrate([60,40,60,40,160])}catch(e){}
  confetti(1);

let fxRun=0;
function confetti(power){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1),Wd=innerWidth,H=innerHeight;
  c.width=Wd*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);
  const cols=['#5C8A6C','#8CC09F','#D6E5D9','#E2B95A','#F2C9B8','#857FB0','#FFFFFF','#3C7775'];
  const P=[],n=Math.round(280*power),run=++fxRun;
  for(let i=0;i<n;i++){const side=i%3;let px,py,vx,vy;
    if(side===0){px=-10;py=H*.75;vx=6+Math.random()*10;vy=-(12+Math.random()*12)}
    else if(side===1){px=Wd+10;py=H*.75;vx=-(6+Math.random()*10);vy=-(12+Math.random()*12)}
    else{px=Math.random()*Wd;py=-20-Math.random()*H*.4;vx=(Math.random()-.5)*3;vy=2+Math.random()*4}
    P.push({x:px,y:py,vx,vy,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length],sh:i%4,d:i%3===2?Math.random()*500:0})}
  const t0=performance.now(),life=3800+800*power;
  (function frame(now){
    if(run!==fxRun)return;const t=now-t0;x.clearRect(0,0,Wd,H);
    if(t>life)return;
    x.globalAlpha=t>life-700?Math.max(0,(life-t)/700):1;
    P.forEach(p=>{if(t<p.d)return;p.vy+=.32;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
      x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
      if(p.sh===0){x.beginPath();x.arc(0,0,p.s/2,0,7);x.fill()}else x.fillRect(-p.s/2,-p.s/4*Math.abs(Math.cos(p.r*2))-1,p.s,p.s/2*Math.abs(Math.cos(p.r*2))+2);
      x.restore()});
    requestAnimationFrame(frame);
  })(t0);
}

/* ---------- drag and drop: press and hold to pick a bubble up (so a normal swipe just scrolls), then drag ---------- */
let drag=null,justDragged=false;
const HOLD=260;
function dragStart(el,x,y,touch){

  if(touch){drag.t=setTimeout(()=>{if(drag&&!drag.on)dragLift()},HOLD);el.classList.add('press')}

  const g=$('#ghost');g.textContent=d.d.label;g.style.background=d.d.c==='s'?'var(--ws)':`var(--w${d.d.c})`;g.style.display='block';

/* fingers */

    case 'settings':sheet(`<h2>Settings</h2>
      <div class="row between"><div><b>Rest timer sound</b><div class="small muted">A short chime when rest is over.</div></div><button class="btn ${S.main.settings.sound?'':'ghost'} sm" data-act="sound">${S.main.settings.sound?'On':'Off'}</button></div>
      <div><b>Look</b><div class="small muted">Pick a colour, then match your phone or go always light or dark.</div><div class="seg scroll" role="group" aria-label="Colour" style="margin-top:8px">${PALETTES.map(([k,n])=>`<button class="${palette===k?'on':''}" data-act="palette" data-t="${k}" aria-pressed="${palette===k}"><i class="sw" data-p="${k}"></i>${n}</button>`).join('')}</div><div class="seg" role="group" aria-label="Look" style="margin-top:8px">${[['auto','Match phone'],['light','Light'],['dark','Dark']].map(([k,n])=>`<button class="${theme===k?'on':''}" data-act="theme" data-t="${k}" aria-pressed="${theme===k}">${n}</button>`).join('')}</div></div>
      <div class="row between"><div><b>Today screen</b><div class="small muted">A home screen with today’s numbers, plan and physio at a glance.</div></div><button class="btn ${HOME()?'':'ghost'} sm" data-act="flag" data-k="home">${HOME()?'On':'Off'}</button></div>
      <div class="row between"><div><b>Levels and points</b><div class="small muted">The level name and points. Achievements stay either way.</div></div><button class="btn ${LV()?'':'ghost'} sm" data-act="flag" data-k="levels">${LV()?'On':'Off'}</button></div>
      ${API?`<div class="row between"><div><b>Coach</b><div class="small muted" id="cst">${coachLine()}</div></div><button class="btn ${COACHON()?'':'ghost'} sm" data-act="flag" data-k="coach">${COACHON()?'On':'Off'}</button></div>`:''}
      <div class="row between"><div><b>Meal planner</b><div class="small muted">Weekly dinners, recipes and a shopping list.</div></div><button class="btn ${MEALS()?'':'ghost'} sm" data-act="flag" data-k="meals">${MEALS()?'On':'Off'}</button></div>
      <div class="row between"><div><b>Physio section</b><div class="small muted">A daily tick-off list for exercises from your physio.</div></div><button class="btn ${S.main.settings.physio?'':'ghost'} sm" data-act="physio-toggle">${S.main.settings.physio?'On':'Off'}</button></div>
      ${GW()?`<div><b>Watch link</b><div class="small muted">Garmin is connected. Sage fetches the latest each time you open it, so it is as fresh as the watch’s last sync with the Garmin Connect app.${gwExpiry()?' The link runs out on '+nice(gwExpiry().date)+' '+gwExpiry().date.slice(0,4)+(gwExpiry().left<=30?' ('+Math.max(0,gwExpiry().left)+' days left). Ask Max to renew it.':'.'):''}</div></div>`:''}
      <div><b>Where your data lives</b><div class="small muted">${API?(cloud==='cloud'?'Saved privately and backed up, so it survives a new phone.':cloud==='checking'?'Connecting…':cloud==='locked'?'Locked.':'Saved on this phone for now. It will back up when Sage can connect.'):cloud==='cloud'?'Saved to your Claude account, so it follows you across devices.':cloud==='checking'?'Checking…':'Saved in this browser on this device.'}</div></div>
      <div><b>Automatic steps</b><div class="small muted" id="drv">${driveLine()}</div><button class="btn ghost sm" style="margin-top:8px" data-act="drive-check">${API||S.main.settings.drive?'Check now':'Turn on and check'}</button></div>
      ${API?'<div><b>This phone</b><div class="small muted">Signing out removes Sage’s data from this phone only. Your backup stays, and the password brings it back.</div><button class="btn ghost sm" style="margin-top:8px" data-act="signout">Sign out on this phone</button></div>':''}
      <button class="btn danger" data-act="reset">Reset everything</button><button class="btn wide" data-act="close">Done</button>`);break;
    case 'coach':closeSheet();ui.screen=null;ui.tab='coach';ui.moved=true;render();break;
    case 'coach-q':coachSend(d.q);break;
    case 'flag':{const on=d.k==='levels'?!LV():!S.main.settings[d.k];S.main.settings[d.k]=on;if(d.k==='home'){ui.tab=on?'today':'week'}if(d.k==='coach'&&on)coachInit();saveMain();render();b.textContent=on?'On':'Off';b.classList.toggle('ghost',!on);break}
    case 'palette':setPalette(d.t,true);document.querySelectorAll('.seg [data-act="palette"]').forEach(x=>{x.classList.toggle('on',x.dataset.t===palette);x.setAttribute('aria-pressed',String(x.dataset.t===palette))});break;
    case 'physio-toggle':S.main.settings.physio=!S.main.settings.physio;if(!S.main.settings.physio&&ui.tab==='physio')ui.tab='week';saveMain();render();b.textContent=S.main.settings.physio?'On':'Off';b.classList.toggle('ghost',!S.main.settings.physio);break;
    case 'theme':theme=d.t;try{localStorage.setItem(THEMELS,theme)}catch(e){}applyTheme();document.querySelectorAll('.seg [data-act="theme"]').forEach(x=>{x.classList.toggle('on',x.dataset.t===theme);x.setAttribute('aria-pressed',String(x.dataset.t===theme))});break;
    case 'drive-check':{const el=$('#drv');if(el)el.textContent=API?'Checking…':'Checking Google Drive…';driveSync(true);break}
    case 'signout':sheet(`<h2>Sign out on this phone?</h2><p class="muted">Sage’s data is removed from this phone. Your backup is kept, and typing the password again brings everything back.</p><button class="btn wide" data-act="signout-yes">Sign out</button><button class="btn ghost wide" data-act="close">Cancel</button>`);break;
    case 'signout-yes':{clearTimeout(mainTimer);const done=()=>{forgetKey();forgetUser();try{localStorage.removeItem(LS);localStorage.removeItem(PALLS);localStorage.removeItem(COACHLS)}catch(e){}location.reload()};if(mainTimer!==null&&col){mainTimer=null;pushMain()}chain.then(done,done);break}
    case 'sound':S.main.settings.sound=!S.main.settings.sound;saveMain();if(!S.main.settings.sound)cancelBeep();b.textContent=S.main.settings.sound?'On':'Off';b.classList.toggle('ghost',!S.main.settings.sound);break;
    case 'reset':sheet(`<h2>Reset everything?</h2><p class="muted">This deletes every logged workout and activity, your plans, your custom exercises and any changes to the workouts. It cannot be undone.</p><button class="btn danger wide" data-act="reset-yes">Yes, delete it all</button><button class="btn wide" data-act="close">Cancel</button>`);break;
    case 'reset-yes':{const ids=S.sessions.map(s=>s.id),dels=[...(S.main.deleted||[]),...ids];S=defaults();S.main.deleted=dels;migrate();if(col)ids.forEach(id=>{chain=chain.then(()=>col&&col.doc(id).delete()).catch(cloudErr)});stopRest();closeSheet();ui.screen=null;ui.tab='week';saveMain();render();break}
    case 'sess':{const s=S.sessions.find(x=>x.id===d.id);if(!s)break;
      sheet(`<h2>${esc(s.name)}</h2><p class="muted num">${nice(s.date)}${s.finishedAt&&(s.entries||[]).some(en=>en.type!=='k')?' · '+Math.max(1,Math.round((s.finishedAt-s.startedAt)/60000))+' min':''}</p>
        <div class="hist">${(s.entries||[]).map(en=>`<div class="h"><span>${esc(en.name)}${en.sets.some(x=>x.pb)?' <span class="pbm">★</span>':''}</span><span class="num muted">${en.type==='k'?fmt(en.sets[0].w)+' kg':en.type==='w'?en.sets.map(x=>fmt(x.w)+'×'+x.r).join('  '):en.sets.map(x=>x.r+(en.type==='t'?'s':'')).join('  ')}</span></div>`).join('')}${s.cls?`<div class="h"><span>${esc(s.cls.name)}</span><span class="num muted">Done ✓</span></div>`:''}</div>
        <button class="btn wide" data-act="close">Close</button><button class="btn danger" data-act="sess-del" data-id="${s.id}">Delete this workout</button>`);break}
    case 'sess-del':S.sessions=S.sessions.filter(x=>x.id!==d.id);S.main.deleted.push(d.id);if(col){const id=d.id;chain=chain.then(()=>col&&col.doc(id).delete()).catch(cloudErr)}closeSheet();saveMain();render();break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,A=S.main.active;
  if(t.id&&t.id.indexOf('st-')===0&&ui.steps&&$('#st-prev')){stepsPrev();return}
  if(t.id==='pq'&&ui.pick){ui.pick.q=t.value;fillPicker();return}
  if(t.id==='wname'&&ui.screen&&ui.screen.wk){W(ui.screen.wk).name=t.value;saveMain();return}
  if(!A||!t.dataset||!t.dataset.f)return;
  if(t.dataset.f==='cls'){A.cls.mins=t.value;saveMain();return}
  if(t.dataset.f==='cw'){A.cls.wts[t.dataset.k]=t.value;saveMain();return}
  const s=A.entries[+t.dataset.e]?.sets[+t.dataset.s];if(s){s[t.dataset.f]=t.value;saveMain()}
});
document.addEventListener('change',e=>{if(e.target.id==='exsel'){ui.exSel=e.target.value;render()}});
document.addEventListener('focusin',e=>{if(e.target.matches&&e.target.matches('.fld input'))try{e.target.select()}catch(x){}});

/* ---------- automatic steps: read a "Sage Steps" Google Sheet through the viewer's Google Drive connector ---------- */
let drive={state:'idle',msg:'',at:0,days:0},driveBusy=false;
function findSheet(o){
  let hit=null;(function walk(x){if(hit||!x||typeof x!=='object')return;
    if(!Array.isArray(x)){const t=x.title||x.name,id=x.id||x.fileId||x.file_id;if(typeof t==='string'&&/sage steps/i.test(t)&&typeof id==='string'&&(!x.mimeType||/spreadsheet/.test(x.mimeType))){hit=id;return}}
    Object.values(x).forEach(walk)})(o);return hit;
}
const driveMsg=e=>{const c=e&&e.code;return c==='needs_reauth'?'Google Drive needs reconnecting in Claude’s settings (Connectors).':c==='server_not_connected'?'Google Drive is not connected to this Claude account. Add it in Claude’s settings (Connectors).':c==='not_in_manifest'||c==='approval_required'||c==='consent_required'||c==='not_granted'?'Sage was not given permission to read Google Drive. Tap Check now and choose Allow.':c==='blocked_by_policy'?'Your organisation blocks this.':'Could not reach Google Drive just now ('+(c||'unknown')+'). Try again shortly.'};
function applySteps(best,whole){
  let ch=false;S.main.acts=S.main.acts||[];
  Object.keys(best).forEach(ds=>{const b=best[ds];if(!b.s&&!b.k)return;const ex=S.main.acts.find(a=>a.type==='Steps'&&a.date===ds);
    if(ex){if(ex.hs!==b.s||(b.k&&ex.hkm!==b.k)){ex.hs=b.s;if(b.k)ex.hkm=b.k;ch=true}}else{S.main.acts.push({id:uid('a'),type:'Steps',date:ds,hs:b.s,hkm:b.k,tkm:0});ch=true}});
  if(!S.main.settings.drive){S.main.settings.drive=true;ch=true}
  drive={state:'ok',msg:'',at:Date.now(),days:Object.keys(best).length,whole};
  if(ch){S.main.acts.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);saveMain();if(!$('#sheet').classList.contains('on')&&!(document.activeElement&&document.activeElement.matches('input')))render()}
  welcomeBack();
}
async function driveSync(manual){
  if(API){
    if(driveBusy||!apiKey||!col)return;driveBusy=true;drive.state='checking';
    try{
      if(!webSteps||manual||Date.now()-webStepsAt>8000){const j=await api({op:'steps',force:manual?1:0});webSteps=j.steps||{};webStepsAt=Date.now();if(manual&&GW()){lastPull=Date.now();await initCloud()}}
      const best={};Object.keys(webSteps).forEach(ds=>{const x=webSteps[ds];if(/^\d{4}-\d{2}-\d{2}$/.test(ds)&&x)best[ds]={s:+x.s||0,k:Math.round((+x.m||0)/10)/100}});
      applySteps(best,true);
    }catch(e){if(e&&e.code==='bad'){cloudErr(e)}drive={state:'error',msg:'Sage could not check for new steps just now. Try again shortly.',at:Date.now(),days:0}}
    finally{driveBusy=false;const el=$('#drv');if(el)el.innerHTML=driveLine()}
    return;
  }
  if(driveBusy||(!manual&&!S.main.settings.drive))return;driveBusy=true;drive.state='checking';
  try{
    const mcp=window.claude&&window.claude.use?await window.claude.use('mcp'):null;
    if(!mcp){drive={state:'error',msg:'Google Drive is not available in this view of Sage.',at:Date.now(),days:0};return}
    let id=S.main.settings.sheetId;
    if(!id){const r=await mcp.callTool('Google Drive','search_files',{query:"title contains 'Sage Steps'",pageSize:10,excludeContentSnippets:true},{cache:false});
      id=findSheet(r.payload)||findSheet(r.structuredContent)||findSheet(r.content);
      if(!id){const t=JSON.stringify(r),m=/"(?:id|fileId)"\s*:\s*"([\w-]{20,})"/.exec(t);if(m&&/sage steps/i.test(t))id=m[1]}
      if(!id){S.main.settings.drive=true;saveMain();drive={state:'nosheet',msg:'Google Drive is connected. No sheet called “Sage Steps” found yet.',at:Date.now(),days:0};return}
      S.main.settings.sheetId=id}
    /* the whole sheet as CSV first (read_file_content only shows the first couple of hundred rows); fall back to it if that fails */
    const grab=o=>{const out=[];(function walk(x){if(typeof x==='string'){if(x.indexOf('SAGE')>=0)out.push(x);else if(x.length>40&&/^[A-Za-z0-9+/=_\-\s]+$/.test(x)){try{const d=atob(x.replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/'));if(d.indexOf('SAGE')>=0)out.push(d)}catch(e){}}}else if(x&&typeof x==='object')Object.values(x).forEach(walk)})(o);return out.join('\n')};
    let text='',whole=true;
    try{const d=await mcp.callTool('Google Drive','download_file_content',{fileId:id,exportMimeType:'text/csv'},{cache:false});text=grab(d)}catch(e){}
    if(!/SAGE_\d/.test(text.replace(/\\+/g,''))){
      whole=false;
      let r;try{r=await mcp.callTool('Google Drive','read_file_content',{fileId:id},{cache:false})}catch(e){if(e&&e.code==='tool_error'){delete S.main.settings.sheetId}throw e}
      const pl=r.payload,fc=pl&&typeof pl==='object'&&typeof pl.fileContent==='string'?pl.fileContent:null;
      text=(fc!==null?fc:(typeof pl==='string'?pl:JSON.stringify(pl||''))+'\n'+(r.content||[]).map(c=>c.text||'').join('\n'));
    }
    text=text.replace(/\\+/g,'');
    const best={};let m;const put=(ds,s,mt)=>{if(!best[ds]||s>=best[ds].s)best[ds]={s,k:Math.round(mt/10)/100}};
    const re=/SAGE_(\d{4}-\d{2}-\d{2})_(\d{1,6})_(\d{1,7})/g;while((m=re.exec(text)))put(m[1],+m[2],+m[3]);
    /* form rows: a timestamp (month/day/year, as this sheet writes it) followed by SAGE_steps_metres */
    const re2=/(\d{1,2})\/(\d{1,2})\/(\d{4})\s+\d{1,2}:\d{2}(?::\d{2})?\s*[|,\t";]+\s*"?SAGE_(\d{1,6})_(\d{1,7})(?!\d|_)/g;
    while((m=re2.exec(text))){let mo=+m[1],d=+m[2];if(mo>12){const t=mo;mo=d;d=t}put(m[3]+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'),+m[4],+m[5])}
    const re3=/(\d{4})-(\d{2})-(\d{2})[T ]\d{1,2}:\d{2}[^|,\t"]{0,12}\s*[|,\t";]+\s*"?SAGE_(\d{1,6})_(\d{1,7})(?!\d|_)/g;
    while((m=re3.exec(text)))put(m[1]+'-'+m[2]+'-'+m[3],+m[4],+m[5]);
    applySteps(best,whole);
  }catch(e){drive={state:'error',msg:driveMsg(e),at:Date.now(),days:0}}
  finally{driveBusy=false;const el=$('#drv');if(el)el.innerHTML=driveLine()}
}
function driveLine(){
  const on=S.main.settings.drive;
  if(API){if(drive.state==='checking')return 'Checking…';if(drive.state==='ok')return `Working. ${drive.days?'Read '+drive.days+' day'+(drive.days===1?'':'s')+' of steps just now.':'No steps have been sent in yet.'}`;if(drive.state==='error')return esc(drive.msg);return cloud==='cloud'?'On. Sage checks for new steps each time it opens.':'Waiting to connect.'}
  if(drive.state==='checking')return 'Checking Google Drive…';
  if(drive.state==='ok')return `Working. Read ${drive.days} day${drive.days===1?'':'s'} of steps from ${drive.whole?'your whole':'the top of your'} “Sage Steps” sheet just now.`;
  if(drive.state==='nosheet'||drive.state==='error')return esc(drive.msg);
  return on?'On. Sage checks your “Sage Steps” sheet each time it opens.':'Off. Turn it on to pull steps from a Google Sheet by itself.';
}

/* ---------- steps sent in by an iPhone Shortcut: #sync-<steps>-<metres>[-<yyyymmdd>] ---------- */
function hashSync(){
  const raw=location.hash||'',m=/^#sync-?(\d{1,6})(?:[-m](\d{0,7}))?(?:[-d](\d{8}))?$/i.exec(raw);if(!m)return;
  const hs=+m[1],hkm=m[2]?Math.round(+m[2]/10)/100:0,ds=m[3]?m[3].slice(0,4)+'-'+m[3].slice(4,6)+'-'+m[3].slice(6):iso(new Date());
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){try{location.hash='week'}catch(x){}}
  if(!hs&&!hkm)return;
  const before=snap(),ex=(S.main.acts||[]).find(a=>a.type==='Steps'&&a.date===ds);
  if(ex){ex.hs=hs;if(hkm)ex.hkm=hkm}else{S.main.acts=S.main.acts||[];S.main.acts.push({id:uid('a'),type:'Steps',date:ds,hs,hkm,tkm:0});S.main.acts.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0)}
  saveMain();ui.screen=S.main.active?ui.screen:null;ui.tab='week';ui.weekOff=0;render();
  const a=acts().find(x=>x.type==='Steps'&&x.date===ds),g=gained(before);if(markSeen())saveMain();
  if(g.newB.length||g.lvl){sheet(`<div style="text-align:center"><span class="tag">Steps synced</span><h2 style="font-size:26px">${esc(actLine(a))}</h2></div>${unlockHTML(g)}<button class="btn wide" data-act="close">Lovely</button>`);confetti(1)}
  else toast('Steps synced: '+actLine(a));
}
window.addEventListener('hashchange',hashSync);
/* website version: when Sage comes back to the front, quietly move to a newer copy if one has been published */
let lastUpd=0;
async function checkUpdate(){
  if(!API||!BUILD||Date.now()-lastUpd<20000)return;lastUpd=Date.now();
  try{const t=await (await fetch(location.pathname+'?u='+Date.now(),{cache:'no-store'})).text(),m=/const BUILD=(\d{6,});/.exec(t);
    if(!m||+m[1]<=BUILD)return;
    if(S.main.active||$('#sheet').classList.contains('on')||$('#lock')||drag)return;
    if(mainTimer!==null&&col){clearTimeout(mainTimer);mainTimer=null;pushMain()}
    const go=()=>location.replace(location.pathname+'?v='+m[1]);chain.then(go,go);
  }catch(e){}
}
/* pick up changes made elsewhere (for example a shortcut sync) when the app comes back to the front */
let lastPull=Date.now();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){if(mainTimer!==null&&col){clearTimeout(mainTimer);mainTimer=null;pushMain()}return}
  checkUpdate();
  if(API&&!apiKey)return;if(document.visibilityState!=='visible'||Date.now()-lastPull<4000)return;lastPull=Date.now();clearTimeout(mainTimer);chain.then(()=>initCloud()).then(()=>driveSync(false)).then(()=>{if(cloud!=='locked')welcomeBack()})});

if(S.main.active)ui.screen='session';
render();
initCloud().then(()=>{if(cloud!=='cloud')persistLocal();hashSync();return driveSync(false)}).then(()=>{if(cloud!=='checking'&&cloud!=='locked')welcomeBack()});
</script>
